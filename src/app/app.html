<main class="grid min-h-screen place-items-center bg-slate-50 px-5 py-8 text-slate-900">
  <section class="w-full max-w-xl rounded-3xl border border-slate-200 bg-white p-8 shadow-xl sm:p-12" aria-labelledby="welcome-title">
    <div class="grid size-12 place-items-center rounded-2xl bg-emerald-100 text-3xl font-bold text-emerald-800" aria-hidden="true">b</div>
    <p class="mb-2 mt-8 text-xs font-bold uppercase tracking-[0.12em] text-emerald-800">Angular starter</p>
    <h1 id="welcome-title" class="text-3xl font-bold tracking-tight sm:text-4xl">Welcome to bruno-angular</h1>
    <p class="mb-6 mt-4 leading-7 text-slate-600">
      Your project is ready. Start building something useful, one component at a time.
    </p>
    <button class="rounded-lg bg-emerald-800 px-5 py-3 font-semibold text-white hover:bg-emerald-900 focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-emerald-300" type="button" (click)="started.set(true)">
      {{ started() ? 'You’re all set' : 'Get started' }}
    </button>
    <p class="mt-4 min-h-6 text-sm text-slate-500" aria-live="polite">
      {{ started() ? 'Your Angular app is running.' : 'Edit src/app/app.html to make this page yours.' }}
    </p>
  </section>
</main>
